name: Research swarm
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-swarm.txt
      - run: python scripts/release_check.py
      - name: Reproduce and independently recompute fixture evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from openline_reports.swarm.experiment import demo, verify_demo
          with tempfile.TemporaryDirectory() as td:
              root = Path(td) / 'proof'
              summary = demo(root)
              print(summary)
              assert summary['decision'] == 'PROMOTE'
              assert summary['generation'] == 1
              print(verify_demo(root, summary['evaluator_public_key']))
          PY
