[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-reports"
version = "0.2.1"
description = "A generic evidence-first research handoff harness."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Terrynce White"}]

[project.scripts]
openline-reports = "openline_reports.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
